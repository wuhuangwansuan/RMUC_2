controller_server:
  ros__parameters:
    use_sim_time: False
    odom_topic: odometry
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.15
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5                   #这个参数定义了机器人在被认为没有进展之前必须移动的最小距离。合理设置这个参数可以帮助机器人更准确地判断是否在路径上取得了进展，从而避免误判停滞状态。
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25              #这个参数定义了机器人在被认为已经到达目标位置之前必须达到的最小距离。合理设置这个参数可以帮助机器人更准确地判断是否已经到达目标位置，从而提高导航的精确性和效率。
      yaw_goal_tolerance: 6.28            #这个参数定义了机器人在被认为已经到达目标位置之前必须达到的最小角度偏差。合理设置这个参数可以帮助机器人更准确地判断是否已经到达目标位置，从而提高导航的精确性和效率。
    FollowPath:
          plugin: "nav2_mppi_controller::MPPIController"
          time_steps: 50  #增加到80，预测时域4.8s，让MPPI能看到冲过目标的后果
          model_dt: 0.05  #稍微放大步长，配合time_steps延长预测时域
          batch_size: 1200 #控制器的采样数。

          vx_std: 0.6 #增大采样多样性，让MPPI能采到更多减速/停止轨迹
          vy_std: 0.6
          wz_std: 0.2

          vx_max: 2.5
          vy_max: 2.5
          wz_max: 1.5

          vx_min: -2.5
          vy_min: -2.5
          wz_min: -1.5

          ax_max: 3.5 #加速度提高，高速时能快速响应
          ay_max: 3.5
          az_max: 3.0

          ax_min: -3.5 #关键：制动力必须对称，高速下刹得住
          ay_min: -3.5
          az_min: -3.0

          iteration_count: 1
          prune_distance: 1.7 #高速下提前剪枝已通过的路径点
          transform_tolerance: 0.3
          temperature: 0.5 #大幅降低：让 MPPI 更果断选最优轨迹，不在次优之间摇摆
          gamma: 0.0 #稍微提高正则化，减少激进抖动
          motion_model: "Omni" #控制器的运动模型。
          visualize: false #是否可视化。
          reset_period: 0.2 # (only in Humble)
          retry_attempt_limit: 1 #软重置的尝试次数
          regenerate_noises: true
          TrajectoryVisualizer:
            trajectory_step: 5 #是指在可视化轨迹时，每隔多少个轨迹点绘制一个点。
            time_step: 3 #是指在可视化轨迹时，每隔多少个时间步长绘制一个点。
          critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "PathFollowCritic", "PathAlignCritic", "ObstaclesCritic"]

          ConstraintCritic:
            enabled: true
            cost_power: 1
            cost_weight: 4.0

          GoalCritic: #必须开启，否则机器人没有到达目标的动力
            enabled: true
            cost_power: 1
            cost_weight: 20.0 #配合二次惩罚适当调整权重
            threshold_to_consider: 5.0

          ObstaclesCritic: #开启提供额外的障碍物排斥力
            enabled: true
            cost_power: 2
            repulsion_weight: 2.0 #排斥权重，降低以允许通过狭窄通道
            critical_weight: 20.0 #近距离障碍物惩罚，适当降低
            consider_footprint: false #用圆形近似，omni机器人更高效
            collision_cost: 10000.0
            collision_margin_distance: 0.30 #碰撞边界余量缩小，允许更靠近障碍物
            near_goal_distance: 0.1

          CostCritic: #通过 costmap 梯度引导避障
            enabled: true
            cost_power: 2
            cost_weight: 2.5 #适当降低，减小膨胀区的排斥作用
            critical_cost: 253.0 #关键修正！只有 inscribed/lethal 才触发碰撞惩罚，不再把整个膨胀区都当碰撞
            consider_footprint: true
            collision_cost: 100000.0
            near_goal_distance: 0.5
            trajectory_point_step: 2

          PathFollowCritic: #必须开启，这是防止乱跑的核心
            enabled: true
            cost_power: 1
            cost_weight: 6.0
            offset_from_furthest: 6 #关注路径前方更远的点
            threshold_to_consider: 1.0 #缩小关闭距离，让路径跟随一直引导到接近目标，防止圆周运动

          PathAlignCritic: #让轨迹方向与路径对齐，高速下更平滑
            enabled: true
            cost_power: 1
            cost_weight: 4.0
            max_path_occupancy_ratio: 0.05
            trajectory_point_step: 4
            threshold_to_consider: 1.0 #与PathFollowCritic同步，在接近目标前持续提供方向引导
            offset_from_furthest: 10
            use_path_orientations: false #omni机器人用运动方向而非朝向

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: False
      update_frequency: 25.0
      publish_frequency: 8.0
      global_frame: odom
      robot_base_frame: gimbal_yaw_fake
      rolling_window: true
      width: 15
      height: 15
      resolution: 0.05
      robot_radius: 0.2
      footprint: "[[-0.3, -0.3],[-0.3, 0.3], [0.3, 0.3], [0.3, -0.3]]"
      plugins: ["static_layer", "intensity_voxel_layer", "inflation_layer"]
      intensity_voxel_layer:
        plugin: pb_nav2_costmap_2d::IntensityVoxelLayer
        enabled: true
        track_unknown_space: true
        footprint_clearing_enabled: true
        publish_voxel_map: false
        combination_method: 1                     #这个参数定义了如何将体素网格层与其他成本地图层组合起来。常见的组合方法包括：0-最大值（Max）、1-覆盖（Overwrite）、2-平均值（Average）等。根据你的需求选择合适的组合方法，以确保机器人能够正确地识别障碍物和未知空间。
        mark_threshold: 0                   
        origin_z: 0.0                           #这个参数定义了体素网格在Z轴上的原点位置，通常设置为0.0表示地面水平面。根据机器人的传感器安装高度和环境调整这个参数，以确保机器人能够正确地识别障碍物和未知空间。
        unknown_threshold: 5                    #这个参数定义了被认为是未知空间的点云点的强度阈值。机器人将忽略强度小于此值的点云点，这些点通常被认为是噪声或未观测到的区域。根据机器人的传感器特性和环境调整这个参数，以确保机器人能够正确地识别未知空间。
        z_resolution: 0.05                      #这个参数定义了体素网格在Z轴上的分辨率，即每个体素在Z轴上的高度。较小的值会增加成本地图的分辨率，但也会增加计算负担；较大的值会降低分辨率，但可以减少计算负担。根据机器人的尺寸和环境复杂度调整这个参数，以确保机器人能够正确地识别障碍物，同时保持良好的性能。   
        z_voxels: 16                            #这个参数定义了体素网格在Z轴上的分辨率，即每个体素在Z轴上的高度。较小的值会增加成本地图的分辨率，但也会增加计算负担；较大的值会降低分辨率，但可以减少计算负担。根据机器人的尺寸和环境复杂度调整这个参数，以确保机器人能够正确地识别障碍物，同时保持良好的性能。
        min_obstacle_height: 0.03                #这个参数定义了被认为是障碍物的点云点的最低高度。机器人将忽略低于此高度的点云点，这些点通常被认为是地面或其他非障碍物。根据机器人的尺寸和环境调整这个参数，以确保机器人能够正确地识别障碍物。
        max_obstacle_height: 2.0                #这个参数定义了被认为是障碍物的点云点的高度范围。机器人将忽略低于 min_obstacle_height 或高于 max_obstacle_height 的点云点，这些点通常被认为是地面、天花板或其他非障碍物。根据机器人的尺寸和环境调整这两个参数，以确保机器人能够正确地识别障碍物。
        min_obstacle_intensity: 0.05              # terrain_analysis 输出 intensity=相对地面高度，阈值过高会过滤掉低矮障碍物
        max_obstacle_intensity: 1.8               #这个参数定义了被认为是障碍物的点云点的最小强度值。机器人将忽略强度小于此值的点云点，这些点通常被认为是噪声或非障碍物。根据机器人的传感器特性和环境调整这个参数，以确保机器人能够正确地识别障碍物。
        observation_sources: terrain_map
        terrain_map:
          data_type: PointCloud2
          # '<robot_namespace>' keyword shall be replaced with 'namespace' where user defined.
          # It doesn't need to start with '/'
          topic: /terrain_map
          sensor_frame: base_footprint
          min_obstacle_height: 0.0                #这个参数定义了被认为是障碍物的点云点的最低高度。机器人将忽略低于此高度的点云点，这些点通常被认为是地面或其他非障碍物。根据机器人的尺寸和环境调整这个参数，以确保机器人能够正确地识别障碍物。
          max_obstacle_height: 1.5                #这个参数定义了被认为是障碍物的点云点的最高高度。机器人将忽略高于此高度的点云点，这些点通常被认为是天花板或其他非障碍物。根据机器人的尺寸和环境调整这个参数，以确保机器人能够正确地识别障碍物。
          obstacle_max_range: 5.0             #这个参数定义了被认为是障碍物的点云点的最大距离。机器人将忽略超过此距离的点云点，这些点通常被认为是远处的物体或噪声。根据机器人的传感器范围和环境调整这个参数，以确保机器人能够正确地识别障碍物。 
          obstacle_min_range: 0.4            # 降低近距过滤，避免近距离挡路障碍被直接滤掉。
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.5
                             # 让局部规划更明显地惩罚贴障路径。增大这个参数会使得成本地图中靠近障碍物的区域成本增加得更快，从而让局部规划更倾向于选择远离障碍物的路径。合理设置这个参数可以帮助机器人更好地避开障碍物，提高导航的安全性和效率。
                                                      # 减小这个参数会使得成本地图中靠近障碍物的区域成本增加得更慢，从而让局部规划更倾向于选择靠近障碍物的路径。合理设置这个参数可以帮助机器人在狭窄环境中更灵活地导航，但也可能增加碰撞的风险。
        inflation_radius: 0.65                    # >= 机器人外接半径 + 安全余量，防止贴障行走。
      always_send_full_costmap: False  #

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: False
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: gimbal_yaw_fake
      resolution: 0.05
      robot_radius: 0.2
      footprint: "[[-0.3, -0.3],[-0.3, 0.3], [0.3, 0.3], [0.3, -0.3]]"
      track_unknown_space: true
      plugins: ["static_layer", "intensity_voxel_layer", "inflation_layer"]
      intensity_voxel_layer:
        plugin: pb_nav2_costmap_2d::IntensityVoxelLayer
        enabled: true
        track_unknown_space: true
        footprint_clearing_enabled: true
        publish_voxel_map: false
        combination_method: 1   #这个参数定义了如何将体素网格层与其他成本地图层组合起来。常见的组合方法包括：0-最大值（Max）、1-覆盖（Overwrite）、2-平均值（Average）等。根据你的需求选择合适的组合方法，以确保机器人能够正确地识别障碍物和未知空间。
        mark_threshold: 0       # 这个参数定义了被认为是未知空间的点云点的强度阈值。机器人将忽略强度小于此值的点云点，这些点通常被认为是噪声或未观测到的区域。根据机器人的传感器特性和环境调整这个参数，以确保机器人能够正确地识别未知空间。
        origin_z: 0.0
        unknown_threshold: 5
        z_resolution: 0.05
        z_voxels: 16
        min_obstacle_height: 0.05          #这个参数定义了被认为是障碍物的点云点的最低高度。机器人将忽略低于此高度的点云点，这些点通常被认为是地面或其他非障碍物。根据机器人的尺寸和环境调整这个参数，以确保机器人能够正确地识别障碍物。
        max_obstacle_height: 1.5          #这个参数定义了被认为是障碍物的点云点的最高高度。机器人将忽略高于此高度的点云点，这些点通常被认为是天花板或其他非障碍物。根据机器人的尺寸和环境调整这个参数，以确保机器人能够正确地识别障碍物。
        min_obstacle_intensity: 0.15      # 降低阈值，提升动态障碍进入全局代价地图的概率。
        max_obstacle_intensity: 15.0       #这个参数定义了被认为是障碍物的点云点的最大强度值。机器人将忽略强度大于此值的点云点，这些点通常被认为是噪声或非障碍物。根据机器人的传感器特性和环境调整这个参数，以确保机器人能够正确地识别障碍物。
        observation_sources: terrain_map_ext
        terrain_map_ext:
          data_type: PointCloud2
          # '<robot_namespace>' keyword shall be replaced with 'namespace' where user defined.
          # It doesn't need to start with '/'
          topic: /terrain_map_ext
          sensor_frame: right_lidar
          min_obstacle_height: 0.1
          max_obstacle_height: 2.0        #这个参数定义了被认为是障碍物的点云点的高度范围。机器人将忽略低于 min_obstacle_height 或高于 max_obstacle_height 的点云点，这些点通常被认为是地面、天花板或其他非障碍物。根据机器人的尺寸和环境调整这两个参数，以确保机器人能够正确地识别障碍物。
          obstacle_max_range: 5.0        # 这个参数定义了被认为是障碍物的点云点的最大距离。机器人将忽略超过此距离的点云点，这些点通常被认为是远处的物体或噪声。根据机器人的传感器范围和环境调整这个参数，以确保机器人能够正确地识别障碍物。
          obstacle_min_range: 0.4
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0     # 让全局规划更明显地惩罚贴障路径。
        inflation_radius: 0.4
      always_send_full_costmap: False

# The yaml_filename does not need to be specified since it going to be set by defaults in launch.
# If you'd rather set it in the yaml, remove the default "map" value in the tb3_simulation_launch.py
# file & provide full path to map below. If CLI map configuration or launch default is provided, that will be used.
map_server:
  ros__parameters:
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    use_sim_time: False
    expected_planner_frequency: 10.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_theta_star_planner/ThetaStarPlanner" # In Iron and older versions, "/" was used instead of "::"
      how_many_corners: 8     # 这个参数定义了路径规划算法在计算路径时考虑的邻居节点的数量。较高的值会使机器人更倾向于选择更短的路径，但可能会增加计算负担；较低的值会使机器人更倾向于选择更安全的路径，但可能会增加路径长度。根据机器人的尺寸和环境复杂度调整这个参数，以确保机器人能够找到合适的路径。
      w_euc_cost: 1.0     # 这个参数定义了欧几里得距离在路径规划中的权重。较高的值会使机器人更倾向于选择更短的路径，但可能会增加计算负担；较低的值会使机器人更倾向于选择更安全的路径，但可能会增加路径长度。根据机器人的尺寸和环境复杂度调整这个参数，以确保机器人能够找到合适的路径。
      w_traversal_cost: 15.0        # 提高障碍代价权重，减少“擦边走”与窄缝强穿。  
      w_heuristic_cost: 1.0         # 这个参数定义了启发式成本在路径规划中的权重。较高的值会使机器人更倾向于选择更接近目标的路径，但可能会增加计算负担；较低的值会使机器人更倾向于选择更安全的路径，但可能会增加路径长度。根据机器人的尺寸和环境复杂度调整这个参数，以确保机器人能够找到合适的路径。  
      consider_dynamic_obstacles: True  # 这个参数定义了路径规划是否考虑动态障碍物。开启后，路径规划将会考虑动态障碍物的存在，并尝试找到避开它们的路径；关闭后，路径规划将只考虑静态障碍物，可能会导致机器人在遇到动态障碍物时无法找到合适的路径。根据机器人的传感器特性和环境调整这个参数，以确保机器人能够正确地识别和避开动态障碍物。
      dynamic_obstacle_inflation: 5.0   # 这个参数定义了动态障碍物的膨胀半径，即在路径规划中将动态障碍物视为一个更大的区域，以增加安全性。较高的值会使机器人更倾向于避开动态障碍物，但可能会增加路径长度；较低的值会使机器人更倾向于接近动态障碍物，但可能会增加碰撞风险。根据机器人的尺寸和环境调整这个参数，以确保机器人能够安全地避开动态障碍物。单位是
      dynamic_obstacle_prediction_time: 1.5   # 提高预测时间窗，否则 0.1s 往往来不及触发有效绕障。
      tolerance: 0.6



smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    use_sim_time: False
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "pb_nav2_behaviors/BackUpFreeSpace"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: gimbal_yaw_fake
    transform_tolerance: 0.3        # 这个参数定义了行为服务器在执行行为时允许的最大变换延迟。较高的值会使机器人更容忍变换延迟，但可能会导致行为执行不够及时；较低的值会使机器人更敏感于变换延迟，但可能会导致行为执行过于频繁。根据机器人的传感器特性和环境调整这个参数，以确保机器人能够正确地执行行为。
    simulate_ahead_time: 2.0        # 模拟提前时间
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
    # params for pb_nav2_behaviors/BackUpFreeSpace
    service_name: "global_costmap/get_costmap"
    max_radius: 2.0   # 这个参数定义了后退行为的最大半径，即机器人在执行后退行为时允许的最大距离。较高的值会使机器人能够后退更远，但可能会增加碰撞风险；较低的值会限制机器人的后退距离，但可以提高安全性。根据机器人的尺寸和环境调整这个参数，以确保机器人能够安全地执行后退行为。
    visualize: false

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20                    # 这个参数定义了路径跟随器的循环频率。较高的值会使机器人更频繁地检查路径和调整速度，但可能会增加计算负担；较低的值会使机器人更少地检查路径和调整速度，但可能会导致行为执行不够及时。根据机器人的性能和环境复杂度调整这个参数，以确保机器人能够正确地跟随路径。
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 0

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [2.5, 2.5, 3.0]
    min_velocity: [-2.5, -2.5, -3.0]
    max_accel: [2.5, 2.5, 5.0]
    max_decel: [-2.5, -2.5, -5.0]
    odom_topic: "odometry"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
